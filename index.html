        const iconSize = size === 'big' ? '1rem' : '0.8rem';
        const gap = size === 'big' ? '8px' : '6px';

        return `<div style="display:flex;align-items:center;gap:${gap};padding:${pad};border-radius:6px;background:${color.bg};border:1px solid ${color.border}22;border-left:3px solid ${color.accent};margin-bottom:3px">
            <span style="font-size:${iconSize}">${icon}</span>
            <span style="font-size:${timeFontSize};font-weight:700;color:${color.accent};min-width:36px">${e.time}</span>
            <span dir="auto" style="font-size:${fontSize};color:#1a1a1a;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${e.title}</span>
            ${e.source === 'gmail' ? `<span style="font-size:0.5rem;padding:1px 4px;border-radius:3px;background:#4285f4;color:white;font-weight:600">Gmail</span>` : ''}
            ${joinLink ? `<a href="${joinLink}" style="font-size:${size === 'big' ? '0.7rem' : '0.6rem'};padding:2px 6px;background:${color.accent};color:white;border-radius:4px;text-decoration:none;font-weight:600">Join</a>` : ''}
            <span onclick="deleteCalEvent('${eventKey.replace(/'/g, "\\'")}')" style="cursor:pointer;font-size:0.65rem;opacity:0.25;transition:opacity 0.15s;padding:0 3px" onmouseover="this.style.opacity=1;this.style.color='#CC0000'" onmouseout="this.style.opacity=0.25;this.style.color='inherit'" title="Hide">&#10005;</span>
        </div>`;
    }

    function renderMiniCalendar() {
        const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
        const daysShort = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
        const todayLabel = days[today.getDay()] + ', ' + today.getDate() + '/' + (today.getMonth()+1);
        const tomorrowLabel = daysShort[tomorrow.getDay()] + ' ' + tomorrow.getDate() + '/' + (tomorrow.getMonth()+1);

        document.getElementById('todayBadge').textContent = '';
        document.getElementById('tmrwBadge').textContent = tomorrowEvents.length + ' meetings ' + tomorrowLabel;

        const now = today.getHours() * 60 + today.getMinutes();

        // Today — BIG timeline bar
        const todayTimeline = buildDayTimeline(todayEvents, true, true);

        // Today — full meeting list
        const upcoming = todayEvents.filter(e => { const [h,m]=e.time.split(':').map(Number); return (h*60+m) >= now; });
        const past = todayEvents.filter(e => { const [h,m]=e.time.split(':').map(Number); return (h*60+m) < now; });
        const upcomingHtml = upcoming.map(e => renderEventRow(e, 'big')).join('');
        const pastHtml = past.length > 0 ? `<div style="opacity:0.4;margin-bottom:4px">${past.map(e => renderEventRow(e, 'big')).join('')}</div>` : '';

        // Tomorrow — meeting list (smaller)
        const tomorrowTimeline = buildDayTimeline(tomorrowEvents, false, false);
        const tomorrowListHtml = tomorrowEvents.map(e => renderEventRow(e, 'small')).join('');

        // Mondial games
        const mondialTodayHtml = renderMondialSection(mondialGames.today, 'Today');

        // Count by source
        const todayOutlook = todayEvents.filter(e => e.source !== 'gmail').length;
        const todayGmail = todayEvents.filter(e => e.source === 'gmail').length;
        const tmrwOutlook = tomorrowEvents.filter(e => e.source !== 'gmail').length;
        const tmrwGmail = tomorrowEvents.filter(e => e.source === 'gmail').length;

        document.getElementById('miniToday').innerHTML = `
            <div style="margin-bottom:6px;flex:1">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
                    <div style="font-size:1.05rem;font-weight:800;color:#1a1a1a;font-family:'Segoe UI',sans-serif">TODAY — ${todayLabel}</div>
                    <div style="display:flex;gap:6px;align-items:center">
                        ${todayOutlook > 0 ? `<span style="font-size:0.6rem;padding:2px 6px;border-radius:4px;background:#fee2e2;color:#CC0000;font-weight:600">${todayOutlook} Outlook</span>` : ''}
                        ${todayGmail > 0 ? `<span style="font-size:0.6rem;padding:2px 6px;border-radius:4px;background:#e8f0fe;color:#4285f4;font-weight:600">${todayGmail} Gmail</span>` : ''}
                    </div>
                </div>
                <div style="font-size:0.8rem;color:var(--text-secondary);margin-bottom:6px">${todayEvents.length} meeting${todayEvents.length !== 1 ? 's' : ''} ${upcoming.length > 0 ? '• Next: <strong style="color:#CC0000">' + upcoming[0].time + ' ' + upcoming[0].title + '</strong>' : ''}</div>
                ${todayTimeline}
                <div style="margin-top:8px;max-height:200px;overflow-y:auto">
                    ${pastHtml}
                    ${upcomingHtml}
                </div>
            </div>
            <div style="padding-top:8px;border-top:2px solid #f0f0f0">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
                    <div style="font-size:0.8rem;font-weight:700;color:var(--text-secondary)">${tomorrowLabel} (${tomorrowEvents.length} meetings)</div>
                    <div style="display:flex;gap:4px;align-items:center">
                        ${tmrwOutlook > 0 ? `<span style="font-size:0.55rem;padding:1px 5px;border-radius:3px;background:#fee2e2;color:#CC0000;font-weight:600">${tmrwOutlook}</span>` : ''}
                        ${tmrwGmail > 0 ? `<span style="font-size:0.55rem;padding:1px 5px;border-radius:3px;background:#e8f0fe;color:#4285f4;font-weight:600">${tmrwGmail}</span>` : ''}
                    </div>
                </div>
                ${tomorrowTimeline}
                <div style="margin-top:4px;max-height:140px;overflow-y:auto">
                    ${tomorrowListHtml || '<div style="text-align:center;padding:6px;color:#aaa;font-size:0.7rem">No meetings</div>'}
                </div>
            </div>
            ${mondialTodayHtml ? `<div style="margin-top:6px;padding-top:4px;border-top:1px solid #f0f0f0"><div style="font-size:0.65rem;font-weight:700;color:#2E7D32;margin-bottom:2px">&#9917; World Cup Today</div>${mondialTodayHtml}</div>` : ''}
        `;
    }

    function renderProjects() {
        const grid = document.getElementById('projectsGrid');
        if (!grid) return;

        if (state.projects.length === 0) {
            grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="empty-state-icon">📂</div><div class="empty-state-text">No projects yet. Click "+ Add Project" to get started.</div></div>';
            return;
        }

        // Sort: active projects first (by priority), completed at the end
        const sorted = [...state.projects].sort((a, b) => {
            if (a.priority === 'done' && b.priority !== 'done') return 1;
            if (a.priority !== 'done' && b.priority === 'done') return -1;
            const pOrder = { critical: 0, high: 1, medium: 2, low: 3, done: 4 };
            return (pOrder[a.priority] || 3) - (pOrder[b.priority] || 3);
        });

        grid.innerHTML = sorted.map(project => {
            const isCompleted = project.priority === 'done';
            const daysLeft = Math.ceil((new Date(project.deadline) - today) / (1000*60*60*24));
            const doneTasks = project.tasks.filter(t => t.done).length;
            const totalTasks = project.tasks.length;
            const progress = totalTasks > 0 ? Math.round((doneTasks / totalTasks) * 100) : 0;
            const activeReminders = (project.reminders || []).filter(r => !r.dismissed).length;

            if (isCompleted) {
                const completedDate = project.completedAt ? new Date(project.completedAt).toLocaleDateString('en-IL', { month: 'short', day: 'numeric' }) : '';
                return `
                    <div class="project-card" style="opacity:0.75;border:2px solid #bbf7d0;background:linear-gradient(135deg,#f0fdf4,#dcfce7)">
                        <div class="project-card-header" onclick="editDeadline('${project.id}')" style="cursor:pointer;border-bottom-color:#bbf7d0">
                            <div>
                                <h3 style="color:#16a34a">&#9989; ${project.name}</h3>
                                <span style="font-size:0.8rem;color:#16a34a;margin-top:2px;display:inline-block">Completed${completedDate ? ' on ' + completedDate : ''} &middot; ${totalTasks} tasks done</span>
                            </div>
                            <div style="display:flex;gap:8px;align-items:center">
                                <span class="project-deadline ok" style="background:#dcfce7;color:#16a34a;border-color:#bbf7d0">DONE</span>
                                <span onclick="event.stopPropagation();reopenProject('${project.id}')" title="Reopen project" style="cursor:pointer;font-size:0.9rem;opacity:0.6;transition:opacity 0.2s" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.6">&#128260;</span>
                                <span onclick="event.stopPropagation();confirmDeleteProject('${project.id}')" title="Delete project" style="cursor:pointer;font-size:1.1rem;opacity:0.4;transition:opacity 0.2s" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.4">&#128465;</span>
                            </div>
                        </div>
                        <div class="project-card-body" style="padding:6px 14px 10px">
                            <div class="project-progress" style="margin-bottom:0">
                                <div class="project-progress-bar" style="width:100%;background:#16a34a"></div>
                            </div>
                        </div>
                    </div>
                `;
            }

            const deadlineClass = daysLeft <= 2 ? 'urgent' : daysLeft <= 5 ? 'soon' : 'ok';
            const deadlineLabel = daysLeft <= 0 ? 'OVERDUE' : daysLeft === 1 ? '1 day left' : `${daysLeft} days`;
            const progressColor = project.priority === 'high' ? '#ef4444' : project.priority === 'medium' ? '#f59e0b' : '#22c55e';

            return `
                <div class="project-card">
                    <div class="project-card-header" onclick="editDeadline('${project.id}')" style="cursor:pointer">
                        <div>
                            <h3>${project.name}</h3>
                            <span style="font-size:0.75rem;color:var(--text-secondary);margin-top:2px;display:inline-block">
                                ${project.status === 'on-track' ? '&#128994;' : project.status === 'risk' ? '&#128992;' : project.status === 'blocked' ? '&#128308;' : '&#128994;'}
                                ${doneTasks}/${totalTasks} tasks &middot; ${project.priority}
                            </span>
                        </div>
                        <div style="display:flex;gap:8px;align-items:center">
                            <span onclick="event.stopPropagation();cycleProjectStatus('${project.id}')" style="cursor:pointer;font-size:0.7rem;padding:2px 6px;border-radius:4px;background:${project.status === 'blocked' ? '#fee2e2' : project.status === 'risk' ? '#fef3c7' : '#dcfce7'};font-weight:600;color:${project.status === 'blocked' ? '#dc2626' : project.status === 'risk' ? '#92400e' : '#16a34a'}">${project.status === 'blocked' ? 'Blocked' : project.status === 'risk' ? 'Risk' : 'On Track'}</span>
                            <span class="project-deadline ${deadlineClass}" onclick="event.stopPropagation()">${deadlineLabel}</span>
                            <span onclick="event.stopPropagation();confirmDeleteProject('${project.id}')" title="Delete project" style="cursor:pointer;font-size:1.1rem;opacity:0.4;transition:opacity 0.2s" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.4">&#128465;</span>
                        </div>
                    </div>
                    <div class="project-card-body">
                        <div class="progress-label">
                            <span>Progress</span>
                            <span style="color:${progressColor}">${progress}%</span>
                        </div>
                        <div class="project-progress">
                            <div class="project-progress-bar" style="width:${progress}%;background:${progressColor}"></div>
                        </div>
                        ${project.topRisk ? `<div style="font-size:0.72rem;padding:3px 6px;background:#fef3c7;border-radius:4px;margin-bottom:4px;border-left:2px solid #f59e0b"><strong style="color:#92400e">Risk:</strong> <span style="color:#78350f">${project.topRisk}</span></div>` : ''}
                        <div class="task-summary">
                            ${(project.nextActions || []).slice(0, 2).map(a => {
                                return `<span class="task-chip" style="background:#f0f4ff;color:#4338ca">${a.text.length > 25 ? a.text.slice(0,25)+'...' : a.text} (${a.owner})</span>`;
                            }).join('')}
                            ${project.tasks.filter(t => !t.done).length > 2 ? `<span class="task-chip">+${project.tasks.filter(t => !t.done).length - 2} tasks</span>` : ''}
                        </div>
                        <button class="expand-tasks-btn" onclick="openAddTaskFromTimeline('${project.id}')">
                            Open Tasks (${totalTasks - doneTasks} remaining)
                        </button>
                    </div>
                </div>
            `;
        }).join('');
    }

    function addTaskGantt(projectId) {
        const input = document.getElementById('ganttTask-' + projectId);
        if (!input || !input.value.trim()) return;
        const project = state.projects.find(p => p.id === projectId);
        project.tasks.push({ id: 't' + Date.now(), text: input.value.trim(), done: false, deadline: project.deadline });
        input.value = '';
        saveState();
        renderGantt();
        renderInsights();
    }

    function toggleTaskGantt(projectId, taskId) {
        const project = state.projects.find(p => p.id === projectId);
        const task = project.tasks.find(t => t.id === taskId);
        task.done = !task.done;
        saveState();
        renderGantt();
        renderInsights();
    }

    function deleteTaskGantt(projectId, taskId) {
        const project = state.projects.find(p => p.id === projectId);
        if (!project) return;
        project.tasks = project.tasks.filter(t => t.id !== taskId);
        saveState();
        renderGantt();
    }

    let expandedProjects = new Set();

    function expandAllProjects() { state.projects.forEach(p => expandedProjects.add(p.id)); renderGantt(); }
    function collapseAllProjects() { expandedProjects.clear(); renderGantt(); }

    function toggleProjectExpand(projectId) {
        if (expandedProjects.has(projectId)) expandedProjects.delete(projectId);
        else expandedProjects.add(projectId);
        renderGantt();
    }

    function renderGantt() {
        const container = document.getElementById('ganttContainer');
        if (state.projects.length === 0) {
            container.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-secondary);font-size:0.8rem">No projects. Click "+ Add" to create one.</div>';
            return;
        }

        const priorityOrder = { critical: 0, high: 1, medium: 2, low: 3, done: 4 };
        const sorted = [...state.projects].sort((a, b) => (priorityOrder[a.priority] || 3) - (priorityOrder[b.priority] || 3));

        const statusColors = { 'on-track': '#16a34a', 'risk': '#f59e0b', 'blocked': '#dc2626' };
        const statusIcons = { 'on-track': '&#128994;', 'risk': '&#128992;', 'blocked': '&#128308;' };
        const statusLabels = { 'on-track': 'On Track', 'risk': 'At Risk', 'blocked': 'Blocked' };
        const priorityColors = { critical: '#CC0000', high: '#e65100', medium: '#f59e0b', low: '#2E7D32', done: '#666' };

        const rowsHtml = sorted.map(p => {
            const isExpanded = expandedProjects.has(p.id);
            const doneTasks = p.tasks.filter(t => t.done).length;
            const totalTasks = p.tasks.length;
            const progress = totalTasks > 0 ? Math.round((doneTasks / totalTasks) * 100) : 0;
            const status = p.status || 'on-track';
            const color = priorityColors[p.priority] || '#666';
            const sColor = statusColors[status] || '#16a34a';

            const tasksHtml = p.tasks.map(t => {
                const taskOverdue = !t.done && t.deadline && new Date(t.deadline) < today;
                return `<div style="display:flex;align-items:center;gap:8px;padding:5px 8px;background:${t.done ? '#f8fdf8' : taskOverdue ? '#fef2f2' : '#fafafa'};border-radius:6px;margin-bottom:3px;transition:background 0.1s" onmouseover="this.style.background='${t.done ? '#f0fdf0' : '#f0f4ff'}'" onmouseout="this.style.background='${t.done ? '#f8fdf8' : taskOverdue ? '#fef2f2' : '#fafafa'}'">
                    <div onclick="toggleTaskGantt('${p.id}','${t.id}')" style="width:18px;height:18px;border-radius:4px;border:2px solid ${t.done ? '#2E7D32' : color};background:${t.done ? '#2E7D32' : 'white'};cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform 0.1s" onmouseover="this.style.transform='scale(1.15)'" onmouseout="this.style.transform='none'">
                        ${t.done ? '<span style="color:white;font-size:0.65rem;font-weight:700">&#10003;</span>' : ''}
                    </div>
                    <span style="flex:1;font-size:0.85rem;${t.done ? 'text-decoration:line-through;color:#999' : 'color:#1a1a1a'}">${t.text}</span>
                    ${t.owner ? `<span style="font-size:0.7rem;padding:2px 8px;border-radius:4px;background:#f0f4ff;color:#4338ca;font-weight:600">${t.owner}</span>` : ''}
                    ${taskOverdue ? '<span style="font-size:0.65rem;color:#dc2626;font-weight:600">overdue</span>' : ''}
                    <span onclick="event.stopPropagation();deleteTaskGantt('${p.id}','${t.id}')" style="cursor:pointer;font-size:0.75rem;color:#ccc;transition:color 0.12s;padding:2px" onmouseover="this.style.color='#dc2626'" onmouseout="this.style.color='#ccc'" title="Remove">&#10005;</span>
                </div>`;
            }).join('');

            const expandedHtml = isExpanded ? `
                <div style="border-top:1px solid #eee;padding:10px 14px 8px;margin-top:4px">
                    <!-- Tasks (always visible, main content) -->
                    <div style="margin-bottom:10px">
                        <div style="font-weight:700;color:#1a1a1a;margin-bottom:6px;font-size:0.85rem">Tasks (${doneTasks}/${totalTasks})</div>
                        ${tasksHtml}
                        <div style="display:flex;gap:6px;margin-top:6px">
                            <input type="text" id="ganttTask-${p.id}" placeholder="+ Add new task..." style="flex:1;padding:8px 12px;border:1.5px solid #e2e8f0;border-radius:6px;font-size:0.85rem;outline:none;transition:border-color 0.15s" onfocus="this.style.borderColor='${color}'" onblur="this.style.borderColor='#e2e8f0'" onkeydown="if(event.key==='Enter')addTaskGantt('${p.id}')">
                            <button onclick="addTaskGantt('${p.id}')" style="padding:8px 14px;background:${color};color:white;border:none;border-radius:6px;font-size:0.85rem;font-weight:700;cursor:pointer;transition:opacity 0.12s" onmouseover="this.style.opacity='0.85'" onmouseout="this.style.opacity='1'">+ Add</button>
                        </div>
                    </div>
                    <!-- Next Actions -->
                    ${(p.nextActions || []).length > 0 ? `<div style="margin-bottom:8px">
                        <div style="font-weight:700;color:#1a1a1a;margin-bottom:4px;font-size:0.8rem">Next Actions:</div>
                        ${(p.nextActions || []).map((a, i) => `
                            <div style="display:flex;align-items:center;gap:6px;padding:4px 0;color:#333;font-size:0.8rem">
                                <span style="color:${color}">&#9679;</span>
                                <span style="flex:1">${a.text}</span>
                                <span style="font-size:0.7rem;padding:2px 8px;border-radius:4px;background:#f0f4ff;color:#4338ca;font-weight:600">${a.owner || ''}</span>
                                <span style="font-size:0.7rem;color:#888">${a.date ? new Date(a.date).toLocaleDateString('en-IL',{month:'short',day:'numeric'}) : ''}</span>
                            </div>
                        `).join('')}
                    </div>` : ''}
                    <div style="display:flex;gap:6px;margin-bottom:8px">
                        <input type="text" id="newAction-${p.id}" placeholder="+ Add action (text / owner / date)" style="flex:1;padding:6px 10px;border:1.5px solid #e2e8f0;border-radius:6px;font-size:0.8rem;outline:none;transition:border-color 0.15s" onfocus="this.style.borderColor='${color}'" onblur="this.style.borderColor='#e2e8f0'" onkeydown="if(event.key==='Enter')addNextAction('${p.id}')">
                        <button onclick="addNextAction('${p.id}')" style="padding:6px 12px;background:${color};color:white;border:none;border-radius:6px;font-size:0.8rem;font-weight:700;cursor:pointer">+</button>
                    </div>
                    <!-- Risk / Decision / Support -->
                    ${p.topRisk ? `<div style="margin-bottom:5px;padding:6px 10px;background:#fef3c7;border-radius:6px;border-left:3px solid #f59e0b;font-size:0.8rem">
                        <span style="font-weight:700;color:#92400e">RISK:</span> <span style="color:#78350f">${p.topRisk}</span>
                        <span onclick="editProjectField('${p.id}','topRisk')" style="cursor:pointer;margin-left:6px;opacity:0.5">&#9998;</span>
                    </div>` : ''}
                    ${p.decision ? `<div style="margin-bottom:5px;padding:6px 10px;background:#ede9fe;border-radius:6px;border-left:3px solid #7c3aed;font-size:0.8rem">
                        <span style="font-weight:700;color:#5b21b6">DECISION:</span> <span style="color:#4c1d95">${p.decision}</span>
                        <span onclick="editProjectField('${p.id}','decision')" style="cursor:pointer;margin-left:6px;opacity:0.5">&#9998;</span>
                    </div>` : ''}
                    ${p.support ? `<div style="margin-bottom:5px;padding:6px 10px;background:#ecfdf5;border-radius:6px;border-left:3px solid #10b981;font-size:0.8rem">
                        <span style="font-weight:700;color:#065f46">SUPPORT:</span> <span style="color:#064e3b">${p.support}</span>
                    </div>` : ''}
                </div>
            ` : '';

            return `
                <div style="border:1.5px solid ${isExpanded ? color+'40' : '#eee'};border-radius:10px;margin-bottom:6px;background:white;transition:all 0.12s;${isExpanded ? 'box-shadow:0 3px 12px rgba(0,0,0,0.06)' : ''}">
                    <div style="display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer" onclick="toggleProjectExpand('${p.id}')">
                        <div style="width:4px;height:32px;border-radius:3px;background:${color};flex-shrink:0"></div>
                        <div style="min-width:0;flex:1">
                            <div style="display:flex;align-items:center;gap:8px">
                                <span style="font-size:1rem;font-weight:700;color:#1a1a1a">${p.name}</span>
                                <span style="font-size:0.7rem;padding:2px 8px;border-radius:4px;background:${color}15;color:${color};font-weight:700;text-transform:uppercase">${p.priority}</span>
                            </div>
                            <div style="display:flex;align-items:center;gap:8px;margin-top:3px">
                                <span style="font-size:0.75rem">${statusIcons[status] || '&#128994;'} ${statusLabels[status] || 'On Track'}</span>
                                <div style="flex:1;height:5px;background:#e8e8e8;border-radius:3px;max-width:100px">
                                    <div style="height:100%;width:${progress}%;background:${sColor};border-radius:3px;transition:width 0.3s"></div>
                                </div>
                                <span style="font-size:0.75rem;color:#666;font-weight:600">${progress}%</span>
                                <span style="font-size:0.75rem;color:#999">${doneTasks}/${totalTasks} tasks</span>
                            </div>
                        </div>
                        <div onclick="event.stopPropagation();cycleProjectStatus('${p.id}')" style="cursor:pointer;font-size:0.75rem;padding:4px 10px;border-radius:6px;background:${sColor}20;color:${sColor};font-weight:700;white-space:nowrap;transition:opacity 0.12s" onmouseover="this.style.opacity='0.7'" onmouseout="this.style.opacity='1'" title="Click to change status">${statusLabels[status]}</div>
                        <span style="font-size:0.75rem;color:#bbb;transform:rotate(${isExpanded ? '90' : '0'}deg);transition:transform 0.2s">&#9654;</span>
                    </div>
                    ${expandedHtml}
                </div>
            `;
        }).join('');

        container.innerHTML = rowsHtml;
    }

    function cycleProjectStatus(projectId) {
        const p = state.projects.find(x => x.id === projectId);
        if (!p) return;
        const cycle = ['on-track', 'risk', 'blocked'];
        const idx = cycle.indexOf(p.status || 'on-track');
        p.status = cycle[(idx + 1) % cycle.length];
        saveState();
        renderGantt();
    }

    function addNextAction(projectId) {
        const input = document.getElementById('newAction-' + projectId);
        if (!input || !input.value.trim()) return;
        const parts = input.value.trim().split('/').map(s => s.trim());
        const p = state.projects.find(x => x.id === projectId);
        if (!p.nextActions) p.nextActions = [];
        const nextWeek = new Date(today); nextWeek.setDate(nextWeek.getDate() + 7);
        p.nextActions.push({
            text: parts[0] || input.value.trim(),
            owner: parts[1] || 'Roee',
            date: parts[2] || nextWeek.toISOString().split('T')[0]
        });
        input.value = '';
        saveState();
        renderGantt();
    }

    function editProjectField(projectId, field) {
        const p = state.projects.find(x => x.id === projectId);
        if (!p) return;
        const current = p[field] || '';
        const newVal = prompt(`Edit ${field}:`, current);
        if (newVal !== null) {
            p[field] = newVal;
            saveState();
            renderGantt();
        }
    }

    let dismissedInsights = JSON.parse(localStorage.getItem('dismissedInsights') || '[]');

    function dismissInsight(insightId, insightLabel) {
        if (!confirm(`Are you sure you want to delete "${insightLabel}"?`)) return;
        dismissedInsights.push(insightId);
        localStorage.setItem('dismissedInsights', JSON.stringify(dismissedInsights));
        renderInsights();
    }

    function openInsightLink(link) {
        if (link) window.location.href = link;
    }

    function buildInsightPreview(insight) {
        if (insight.previewType === 'teams') {
            return `<div class="insight-preview">
                <div class="insight-preview-header"><span class="preview-badge teams">Teams</span> Message Preview</div>
                <div class="insight-preview-body">
                    <div class="preview-from">${insight.previewFrom || ''}</div>
                    <div class="preview-snippet">${insight.previewContent || ''}</div>
                    <div class="preview-time">${insight.previewTime || ''}</div>
                </div>
                <div class="insight-preview-action">Click to open in Teams app</div>
            </div>`;
        }
        if (insight.previewType === 'email') {
            return `<div class="insight-preview">
                <div class="insight-preview-header"><span class="preview-badge outlook">Outlook</span> Email Preview</div>
                <div class="insight-preview-body">
                    <div class="preview-from">From: ${insight.previewFrom || ''}</div>
                    <div class="preview-subject">${insight.previewSubject || ''}</div>
                    <div class="preview-snippet">${insight.previewContent || ''}</div>
                    <div class="preview-time">${insight.previewTime || ''}</div>
                </div>
                <div class="insight-preview-action">Click to open in Outlook</div>
            </div>`;
        }
        if (insight.previewType === 'task') {
            return `<div class="insight-preview">
                <div class="insight-preview-header"><span class="preview-badge task">Tasks</span> Details</div>
                <div class="insight-preview-body">
                    ${insight.previewContent || ''}
                </div>
                <div class="insight-preview-action">Click to view project</div>
            </div>`;
        }
        return '';
    }

    function renderInsights() {
        const insights = [];

        // --- PERSONAL INSIGHTS ONLY: things that require YOUR action ---

        // YOUR overdue tasks
        const overdue = state.projects.flatMap(p => p.tasks.filter(t => !t.done && new Date(t.deadline) < today).map(t => ({...t, projectName: p.name, projectId: p.id})));
        if (overdue.length > 0) {
            const taskList = overdue.slice(0,4).map(t => `<div style="padding:2px 0">&#9679; <strong>${t.text}</strong> <span style="color:#dc2626">(${t.projectName})</span></div>`).join('');
            insights.push({ id: 'overdue-' + overdue.length, label: `${overdue.length} overdue tasks`, icon: '&#9888;&#65039;', text: `<strong>${overdue.length} overdue task${overdue.length > 1 ? 's' : ''}</strong>: ${overdue.slice(0,3).map(t => t.text).join(', ')}`, keywords: overdue.slice(0,3).map(t => t.text).join(' '), previewType: 'task', previewContent: taskList, link: null });
        }

        // YOUR project deadlines approaching
        const soon = state.projects.filter(p => {
            const d = (new Date(p.deadline) - today) / (1000*60*60*24);
            return d >= 0 && d <= 3;
        });
        if (soon.length > 0) {
            const deadlineList = soon.map(p => {
                const d = Math.ceil((new Date(p.deadline) - today) / (1000*60*60*24));
                return `<div style="padding:2px 0">&#9679; <strong>${p.name}</strong> — ${d === 0 ? 'TODAY' : d + ' day' + (d>1?'s':'')} left</div>`;
            }).join('');
            insights.push({ id: 'deadline-soon-' + soon.map(p=>p.id).join(','), label: `${soon.length} deadlines within 3 days`, icon: '&#128680;', text: `<strong>${soon.length} project deadline${soon.length > 1 ? 's' : ''} within 3 days:</strong> ${soon.map(p => p.name).join(', ')}`, keywords: soon.map(p => p.name).join(' '), previewType: 'task', previewContent: deadlineList, link: null });
        }

        // YOUR tasks due today
        const dueToday = state.projects.flatMap(p => p.tasks.filter(t => !t.done && t.deadline === todayStr).map(t => ({...t, projectName: p.name})));
        if (dueToday.length > 0) {
            const todayList = dueToday.map(t => `<div style="padding:2px 0">&#9679; ${t.text} <span style="color:var(--text-secondary)">(${t.projectName})</span></div>`).join('');
            insights.push({ id: 'due-today-' + dueToday.length, label: `${dueToday.length} tasks due today`, icon: '&#9200;', text: `<strong>${dueToday.length} task${dueToday.length > 1 ? 's' : ''} due today:</strong> ${dueToday.map(t => t.text).join(', ')}`, keywords: dueToday.map(t => t.text).join(' '), previewType: 'task', previewContent: todayList, link: null });
        }

        // YOUR busy day tomorrow (meetings you need to attend)
        if (tomorrowEvents.length >= 5) {
            const calList = tomorrowEvents.slice(0,5).map(e => `<div style="padding:2px 0"><strong>${e.time}</strong> ${e.title}</div>`).join('') + (tomorrowEvents.length > 5 ? `<div style="color:var(--text-secondary);padding:2px 0">+${tomorrowEvents.length - 5} more...</div>` : '');
            insights.push({ id: 'busy-tomorrow', label: 'Busy day tomorrow', icon: '&#128197;', text: `<strong>Busy day tomorrow</strong> — ${tomorrowEvents.length} meetings on your calendar. Block focus time for high-priority tasks.`, keywords: tomorrowEvents.map(e => e.title).join(' '), previewType: 'task', previewContent: calList, link: null });
        }

        // YOUR @mentions in Teams (people asking YOU directly)
        if (teamsMentions.length > 0) {
            const firstMention = teamsMentions[0];
            const mentionLinks = teamsMentions.slice(0, 3).map(m =>
                `<a class="source-link teams" href="${teamsDeepLink(m)}" style="border-color:#fecaca">@ ${m.from}: ${m.content.slice(0,30)}...</a>`
            ).join('');
            insights.unshift({
                id: 'mentions-' + teamsMentions.length,
                label: `${teamsMentions.length} Teams @mentions`,
                icon: '&#128680;',
                text: `<strong>${teamsMentions.length} Teams @mention${teamsMentions.length > 1 ? 's' : ''} need your response</strong><div class="insight-sources">${mentionLinks}</div>`,
                keywords: teamsMentions.map(m => m.content + ' ' + m.from).join(' '),
                previewType: 'teams',
                previewFrom: firstMention.from,
                previewContent: firstMention.content,
                previewTime: formatTimeAgo(firstMention.time) + ' ago in ' + firstMention.chatTopic,
                link: teamsDeepLink(firstMention)
            });
        }

        // YOUR pending reminders (things you set for yourself)
        const pendingReminders = state.projects.flatMap(p => (p.reminders || []).filter(r => !r.dismissed).map(r => ({...r, projectName: p.name})));
        if (pendingReminders.length > 0) {
            const dueNow = pendingReminders.filter(r => r.time && new Date(r.time) <= new Date());
            const reminderList = (dueNow.length > 0 ? dueNow : pendingReminders).slice(0,3).map(r => `<div style="padding:2px 0">&#128276; ${r.text} <span style="color:var(--text-secondary)">(${r.projectName})</span></div>`).join('');
            if (dueNow.length > 0) {
                insights.push({ id: 'reminders-due-' + dueNow.length, label: `${dueNow.length} reminders due`, icon: '&#128276;', text: `<strong>${dueNow.length} reminder${dueNow.length > 1 ? 's' : ''} due now:</strong> ${dueNow.slice(0,2).map(r => r.text).join(', ')}`, keywords: dueNow.map(r => r.text).join(' '), previewType: 'task', previewContent: reminderList, link: null });
            } else {
                insights.push({ id: 'reminders-' + pendingReminders.length, label: `${pendingReminders.length} active reminders`, icon: '&#128276;', text: `<strong>${pendingReminders.length} active reminder${pendingReminders.length > 1 ? 's' : ''}</strong> set across your projects.`, keywords: pendingReminders.map(r => r.text).join(' '), previewType: 'task', previewContent: reminderList, link: null });
            }
        }

        // YOUR high priority overload
        const highP = state.projects.filter(p => p.priority === 'high');
        if (highP.length >= 3) {
            const hpList = highP.map(p => `<div style="padding:2px 0">&#9679; ${p.name} — due ${p.deadline}</div>`).join('');
            insights.push({ id: 'high-priority-' + highP.length, label: `${highP.length} high-priority projects`, icon: '&#9889;', text: `<strong>${highP.length} high-priority projects</strong> on your plate. Consider delegating or re-sequencing.`, keywords: highP.map(p => p.name).join(' '), previewType: 'task', previewContent: hpList, link: null });
        }

        // YOUR unread emails (sent directly to you)
        if (liveEmails.length > 0) {
            const unread = liveEmails.filter(e => !e.isRead);
            if (unread.length > 0) {
                const firstEmail = unread[0];
                const emailLinks = unread.slice(0, 3).map(e => {
                    const link = e.entryId ? makeOutlookLink(e.entryId) : '#';
                    return `<a class="source-link outlook" href="${link}" title="${(e.subject||'').replace(/"/g,'&quot;')}">&#128231; ${(e.from || 'Unknown').slice(0,15)}: ${(e.subject||'').slice(0,20)}</a>`;
                }).join('');
                insights.push({
                    id: 'unread-emails-' + unread.length,
                    label: `${unread.length} unread emails`,
                    icon: '&#128232;',
                    text: `<strong>${unread.length} unread email${unread.length > 1 ? 's' : ''}</strong> in your inbox.<div class="insight-sources">${emailLinks}</div>`,
                    keywords: unread.map(e => e.subject + ' ' + e.from).join(' '),
                    previewType: 'email',
                    previewFrom: firstEmail.from || 'Unknown',
                    previewSubject: firstEmail.subject || '(no subject)',
                    previewContent: (firstEmail.preview || '').slice(0, 120),
                    previewTime: firstEmail.receivedTime ? formatTimeAgo(firstEmail.receivedTime) + ' ago' : '',
                    link: firstEmail.entryId ? makeOutlookLink(firstEmail.entryId) : null
                });
            }
        }

        // YOUR recent Teams chats (real data from Graph API)
        if (teamsChats.length > 0) {
            const recentChats = teamsChats.filter(c => {
                if (!c.lastMessageTime) return false;
                const hoursAgo = (Date.now() - new Date(c.lastMessageTime)) / (1000*60*60);
                return hoursAgo <= 3;
            });
            if (recentChats.length > 0) {
                const firstChat = recentChats[0];
                const chatLinks = recentChats.slice(0, 3).map(c =>
                    `<a class="source-link teams" href="${teamsDeepLink(c)}">&#128172; ${(c.topic || 'Chat').slice(0, 25)}</a>`
                ).join('');
                insights.push({
                    id: 'recent-chats-' + recentChats.length,
                    label: `${recentChats.length} recent Teams messages`,
                    icon: '&#128172;',
                    text: `<strong>${recentChats.length} Teams chat${recentChats.length > 1 ? 's' : ''} with recent messages</strong><div class="insight-sources">${chatLinks}</div>`,
                    keywords: recentChats.map(c => c.topic || c.lastMessage).join(' '),
                    previewType: 'teams',
                    previewFrom: firstChat.lastMessageFrom || firstChat.topic,
                    previewContent: firstChat.lastMessage || '',
                    previewTime: formatTimeAgo(firstChat.lastMessageTime) + ' ago',
                    link: teamsDeepLink(firstChat)
                });
            }
        }

        // Filter out dismissed insights
        const visibleInsights = insights.filter(i => !dismissedInsights.includes(i.id)).slice(0, 8);

        const insightsHeader = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;padding-bottom:4px;border-bottom:2px solid #f0f0f0;flex-shrink:0">
            <h2 style="font-size:0.85rem;font-weight:700;color:#7c3aed">&#9889; AI Insights</h2>
            <span style="font-size:0.55rem;padding:1px 5px;border-radius:8px;background:#f3e8ff;color:#7c3aed;font-weight:600">${visibleInsights.length}</span>
        </div>`;

        const insPanel = document.getElementById('insightsPanel');
        if (!insPanel) return;
        insPanel.innerHTML = insightsHeader + (visibleInsights.length > 0 ? visibleInsights.map(i => `
            <div class="insight-item" onclick="openInsightLink('${(i.link || '').replace(/'/g, "\\'")}')" style="padding:6px 8px;margin-bottom:4px">
                ${buildInsightPreview(i)}
                <span class="insight-icon">${i.icon}</span>
                <span class="insight-text" style="font-size:0.75rem">${i.text}</span>
                <span onclick="event.stopPropagation();dismissInsight('${i.id}', '${i.label.replace(/'/g, "\\'")}')" style="cursor:pointer;font-size:0.65rem;color:#ccc;transition:color 0.15s;padding:0 3px;flex-shrink:0" onmouseover="this.style.color='#CC0000'" onmouseout="this.style.color='#ccc'">&#10005;</span>
            </div>
        `).join('') : '<div style="text-align:center;padding:16px;color:var(--text-secondary);font-size:0.8rem"><div style="font-size:1.3rem;margin-bottom:6px">&#10024;</div>All clear — no action items right now.</div>');
    }

    // ============ ACTIONS ============
    function toggleTask(projectId, taskId) {
        const project = state.projects.find(p => p.id === projectId);
        const task = project.tasks.find(t => t.id === taskId);
        task.done = !task.done;
        saveState();
        renderAll();
    }

    function addTask(projectId) {
        const input = document.getElementById(`newTask-${projectId}`);
        const dateInput = document.getElementById(`newTaskDate-${projectId}`);
        if (!input.value.trim()) return;

        const project = state.projects.find(p => p.id === projectId);
        project.tasks.push({
            id: 't' + Date.now(),
            text: input.value.trim(),
            done: false,
            deadline: dateInput.value || project.deadline
        });
        input.value = '';
        saveState();
        renderAll();
    }

    function openAddTaskFromTimeline(projectId) {
        const project = state.projects.find(p => p.id === projectId);
        if (!project) return;
        const daysLeft = Math.ceil((new Date(project.deadline) - today) / (1000*60*60*24));
        const doneTasks = project.tasks.filter(t => t.done).length;
        const totalTasks = project.tasks.length;
        const progress = totalTasks > 0 ? Math.round((doneTasks / totalTasks) * 100) : 0;

        const html = `
            <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
                <div class="modal" style="max-width:600px">
                    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px">
                        <div>
                            <h2 style="margin-bottom:4px">${project.name}</h2>
                            <span style="font-size:0.85rem;color:var(--text-secondary)">
                                ${daysLeft <= 0 ? '<span style="color:var(--accent-red);font-weight:700">OVERDUE</span>' : daysLeft + ' days left'}
                                &nbsp;·&nbsp; ${doneTasks}/${totalTasks} tasks done &nbsp;·&nbsp; ${progress}%
                            </span>
                        </div>
                        <span onclick="closeModal()" style="cursor:pointer;font-size:1.5rem;color:var(--text-secondary);line-height:1">&times;</span>
                    </div>

                    <div style="background:#f8fafc;border-radius:8px;padding:4px 0;margin-bottom:16px">
                        ${project.tasks.length === 0 ? '<p style="text-align:center;padding:16px;color:var(--text-secondary)">No tasks yet. Add one below.</p>' : ''}
                        ${project.tasks.map(t => {
                            const td = Math.ceil((new Date(t.deadline) - today) / (1000*60*60*24));
                            const isOverdue = td < 0 && !t.done;
                            const taskSources = renderSourceLinks(t.text);
                            return `
                            <div style="display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-bottom:1px solid #f0f0f0;transition:background 0.15s;flex-wrap:wrap" onmouseover="this.style.background='#FEF2F2'" onmouseout="this.style.background='transparent'">
                                <div style="width:22px;height:22px;border-radius:6px;border:2.5px solid ${t.done ? 'var(--accent-green)' : '#E53935'};background:${t.done ? 'var(--accent-green)' : 'white'};cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.15s;margin-top:2px" onclick="toggleTaskInModal('${project.id}','${t.id}')">
                                    ${t.done ? '<span style="color:white;font-size:0.7rem;font-weight:700">✓</span>' : ''}
                                </div>
                                <div style="flex:1;min-width:0">
                                    <span style="font-size:1rem;${t.done ? 'text-decoration:line-through;opacity:0.45' : ''}">${t.text}</span>
                                    ${taskSources}
                                </div>
                                <span style="font-size:0.78rem;padding:2px 8px;border-radius:4px;background:${isOverdue ? '#fee2e2' : '#f1f5f9'};color:${isOverdue ? 'var(--accent-red)' : 'var(--text-secondary)'};font-weight:${isOverdue ? '700' : '400'}">${t.deadline ? (isOverdue ? 'OVERDUE' : t.deadline.slice(5)) : ''}</span>
                                <span style="cursor:pointer;color:var(--text-secondary);font-size:1.2rem;opacity:0.5;transition:opacity 0.15s" onmouseover="this.style.opacity=1;this.style.color='var(--accent-red)'" onmouseout="this.style.opacity=0.5;this.style.color='var(--text-secondary)'" onclick="removeTaskFromModal('${project.id}','${t.id}')">&#128465;</span>
                            </div>`;
                        }).join('')}
                    </div>

                    <div style="display:flex;gap:8px;align-items:center">
                        <input type="text" id="timelineNewTask" placeholder="Add a task..." style="flex:1;padding:10px 14px;border:1.5px solid #f0f0f0;border-radius:8px;font-size:1rem;font-family:inherit" onkeydown="if(event.key==='Enter')addTaskFromModal('${project.id}')">
                        <input type="date" id="timelineNewTaskDate" value="${project.deadline}" style="padding:10px;border:1.5px solid #f0f0f0;border-radius:8px;font-size:0.85rem;font-family:inherit">
                        <button class="btn btn-primary" onclick="addTaskFromModal('${project.id}')" style="white-space:nowrap">+ Add</button>
                    </div>
                </div>
            </div>
        `;
        document.getElementById('modalContainer').innerHTML = html;
        setTimeout(() => document.getElementById('timelineNewTask').focus(), 100);
    }

    function toggleTaskInModal(projectId, taskId) {
        const project = state.projects.find(p => p.id === projectId);
        const task = project.tasks.find(t => t.id === taskId);
        task.done = !task.done;
        saveState();
        openAddTaskFromTimeline(projectId);
        renderProjects();
        renderGantt();
        renderInsights();
    }

    function addTaskFromModal(projectId) {
        const text = document.getElementById('timelineNewTask').value.trim();
        if (!text) return;
        const deadline = document.getElementById('timelineNewTaskDate').value;
        const project = state.projects.find(p => p.id === projectId);
        project.tasks.push({ id: 't' + Date.now(), text, done: false, deadline });
        saveState();
        closeModal();
        openAddTaskFromTimeline(projectId);
        renderAll();
    }

    function removeTaskFromModal(projectId, taskId) {
        const project = state.projects.find(p => p.id === projectId);
        const task = project.tasks.find(t => t.id === taskId);
        if (!confirm(`Delete task "${task.text}"?`)) return;
        project.tasks = project.tasks.filter(t => t.id !== taskId);
        saveState();
        closeModal();
        openAddTaskFromTimeline(projectId);
        renderAll();
    }

    function removeTask(projectId, taskId) {
        const project = state.projects.find(p => p.id === projectId);
        const task = project.tasks.find(t => t.id === taskId);
        if (!confirm(`Delete task "${task.text}"?`)) return;
        project.tasks = project.tasks.filter(t => t.id !== taskId);
        saveState();
        renderAll();
    }

    function editDeadline(projectId) {
        const project = state.projects.find(p => p.id === projectId);
        const html = `
            <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
                <div class="modal">
                    <h2>Edit Project: ${project.name}</h2>
                    <div class="form-group">
                        <label>Project Name</label>
                        <input type="text" id="editProjName" value="${project.name}">
                    </div>
                    <div class="form-group">
                        <label>Deadline</label>
                        <input type="date" id="editProjDeadline" value="${project.deadline}">
                    </div>
                    <div class="form-group">
                        <label>Start Date</label>
                        <input type="date" id="editProjStart" value="${project.startDate}">
                    </div>
                    <div class="form-group">
                        <label>Priority</label>
                        <select id="editProjPriority">
                            <option value="high" ${project.priority==='high'?'selected':''}>High</option>
                            <option value="medium" ${project.priority==='medium'?'selected':''}>Medium</option>
                            <option value="low" ${project.priority==='low'?'selected':''}>Low</option>
                        </select>
                    </div>
                    <div style="display:flex;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid #f1f5f9">
                        <button class="btn btn-success" onclick="markProjectComplete('${project.id}')" style="font-size:0.78rem">&#x2713; Mark Complete</button>
                        <button class="btn btn-ghost" onclick="exportProjectEmail('${project.id}')" style="color:var(--text-primary);font-size:0.78rem">&#x2709; Export to Email</button>
                    </div>
                    <div class="modal-actions">
                        <button class="btn btn-danger" onclick="confirmDeleteProject('${project.id}')">Delete</button>
                        <button class="btn btn-ghost" onclick="closeModal()" style="color:var(--text-primary)">Cancel</button>
                        <button class="btn btn-primary" onclick="saveProjectEdit('${project.id}')">Save</button>
                    </div>
                </div>
            </div>
        `;
        document.getElementById('modalContainer').innerHTML = html;
    }

    function saveProjectEdit(projectId) {
        const project = state.projects.find(p => p.id === projectId);
        project.name = document.getElementById('editProjName').value;
        project.deadline = document.getElementById('editProjDeadline').value;
        project.startDate = document.getElementById('editProjStart').value;
        project.priority = document.getElementById('editProjPriority').value;
        saveState();
        closeModal();
        renderAll();
    }

    function deleteProject(projectId) {
        state.projects = state.projects.filter(p => p.id !== projectId);
        saveState();
        closeModal();
        renderAll();
    }

    function confirmDeleteProject(projectId) {
        const project = state.projects.find(p => p.id === projectId);
        if (!project) return;
        const html = `
            <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
                <div class="modal" style="max-width:400px;text-align:center">
                    <h2 style="color:var(--accent-red)">Delete Project?</h2>
                    <p style="font-size:1.05rem;margin-bottom:20px">Are you sure you want to delete <strong>"${project.name}"</strong> and all its ${project.tasks.length} tasks?</p>
                    <div class="modal-actions" style="justify-content:center">
                        <button class="btn btn-ghost" onclick="closeModal()" style="color:var(--text-primary)">Cancel</button>
                        <button class="btn btn-danger" style="font-size:1rem;padding:10px 20px" onclick="deleteProject('${project.id}')">Delete</button>
                    </div>
                </div>
            </div>
        `;
        document.getElementById('modalContainer').innerHTML = html;
    }

    function openAddProject() {
        const html = `
            <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
                <div class="modal">
                    <h2>New Project</h2>
                    <div class="form-group">
                        <label>Project Name</label>
                        <input type="text" id="newProjName" placeholder="e.g. Equipment Lifecycle Update">
                    </div>
                    <div class="form-group">
                        <label>Deadline</label>
                        <input type="date" id="newProjDeadline">
                    </div>
                    <div class="form-group">
                        <label>Start Date</label>
                        <input type="date" id="newProjStart" value="${todayStr}">
                    </div>
                    <div class="form-group">
                        <label>Priority</label>
                        <select id="newProjPriority">
                            <option value="high">High</option>
                            <option value="medium" selected>Medium</option>
                            <option value="low">Low</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Initial Tasks (one per line)</label>
                        <textarea id="newProjTasks" rows="4" placeholder="Task 1&#10;Task 2&#10;Task 3"></textarea>
                    </div>
                    <div class="modal-actions">
                        <button class="btn btn-ghost" onclick="closeModal()" style="color:var(--text-primary)">Cancel</button>
                        <button class="btn btn-primary" onclick="createProject()">Create</button>
                    </div>
                </div>
            </div>
        `;
        document.getElementById('modalContainer').innerHTML = html;
    }

    function createProject() {
        const name = document.getElementById('newProjName').value.trim();
        if (!name) return alert('Please enter a project name');
        const deadline = document.getElementById('newProjDeadline').value;
        const startDate = document.getElementById('newProjStart').value || todayStr;
        const priority = document.getElementById('newProjPriority').value;
        const tasksText = document.getElementById('newProjTasks').value.trim();
        const tasks = tasksText ? tasksText.split('\n').filter(l => l.trim()).map((t, i) => ({
            id: 't' + Date.now() + i,
            text: t.trim(),
            done: false,
            deadline: deadline || ''
        })) : [];

        state.projects.push({
            id: 'p' + Date.now(),
            name,
            priority,
            deadline: deadline || '',
            startDate,
            progress: 0,
            tasks,
            reminders: []
        });
        saveState();
        closeModal();
        renderAll();
    }

    // ============ REMINDERS ============
    function openReminders(projectId) {
        const project = state.projects.find(p => p.id === projectId);
        const reminders = project.reminders || [];

        const html = `
            <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
                <div class="modal">
                    <h2>Reminders: ${project.name}</h2>
                    <div style="margin-bottom:16px">
                        ${reminders.length > 0 ? reminders.map(r => `
                            <div style="display:flex;gap:8px;align-items:center;padding:8px;background:#f8fafc;border-radius:6px;margin-bottom:6px">
                                <span style="font-size:0.82rem;flex:1;${r.dismissed?'text-decoration:line-through;opacity:0.5':''}">${r.text}</span>
                                <span style="font-size:0.68rem;color:var(--text-secondary)">${r.time ? new Date(r.time).toLocaleString('en-IL',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : ''}</span>
                                ${!r.dismissed ? `<button class="btn btn-sm btn-danger" onclick="dismissReminder('${projectId}','${r.id}')">Dismiss</button>` : ''}

    function addReminder(projectId) {
        const text = document.getElementById('newReminderText').value.trim();
        if (!text) return;
        const time = document.getElementById('newReminderTime').value;

        const project = state.projects.find(p => p.id === projectId);
        if (!project.reminders) project.reminders = [];
        project.reminders.push({
            id: 'r' + Date.now(),
            text,
            time: time || null,
            dismissed: false
        });
        saveState();
        closeModal();
        openReminders(projectId);
        renderAll();
    }

    function dismissReminder(projectId, reminderId) {
        const project = state.projects.find(p => p.id === projectId);
        const reminder = project.reminders.find(r => r.id === reminderId);
        reminder.dismissed = true;
        saveState();
        closeModal();
        openReminders(projectId);
        renderAll();
    }

    function deleteReminder(projectId, reminderId) {
        const project = state.projects.find(p => p.id === projectId);
        project.reminders = project.reminders.filter(r => r.id !== reminderId);
        saveState();
        closeModal();
        openReminders(projectId);
        renderAll();
    }

    function checkReminders() {
        const now = new Date();
        const container = document.getElementById('reminderContainer');
        const popups = [];

        state.projects.forEach(project => {
            (project.reminders || []).forEach(reminder => {
                if (reminder.dismissed || !reminder.time) return;
                const rTime = new Date(reminder.time);
                const diff = (now - rTime) / 60000; // minutes
                if (diff >= 0 && diff <= 60) {
                    popups.push({ project: project.name, ...reminder, projectId: project.id });
                }
            });
        });

        if (popups.length > 0) {
            container.innerHTML = popups.map(p => `
                <div class="reminder-popup">
                    <span class="dismiss" onclick="dismissReminderPopup('${p.projectId}','${p.id}')">&times;</span>
                    <h4>&#128276; ${p.project}</h4>
                    <p>${p.text}</p>
                </div>
            `).join('');
        }
    }

    function dismissReminderPopup(projectId, reminderId) {
        dismissReminder(projectId, reminderId);
        document.getElementById('reminderContainer').innerHTML = '';
        renderAll();
    }

    function duplicateProject(projectId) {
        const original = state.projects.find(p => p.id === projectId);
        const clone = JSON.parse(JSON.stringify(original));
        clone.id = 'p' + Date.now();
        clone.name = original.name + ' (copy)';
        clone.tasks = clone.tasks.map(t => ({ ...t, id: 't' + Date.now() + Math.random().toString(36).slice(2, 6), done: false }));
        clone.priority = original.priority === 'done' ? 'medium' : original.priority;
        delete clone.completedAt;
        state.projects.push(clone);
        saveState();
        openTimelineFullscreen();
        renderProjects();
        renderGantt();

    async function refreshData() {
        updateDates();
        const indicator = document.getElementById('refreshIndicator');
        indicator.classList.add('visible');

        try {
            // Always clear calendar on refresh — use Israel timezone for date comparison
            const ilNow = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Jerusalem' }));
            const ilTmrw = new Date(ilNow); ilTmrw.setDate(ilTmrw.getDate() + 1);
            if (ilTmrw.getDay() === 6) ilTmrw.setDate(ilTmrw.getDate() + 1); // skip Saturday
            const todayLocal = ilNow.getFullYear() + '-' + String(ilNow.getMonth()+1).padStart(2,'0') + '-' + String(ilNow.getDate()).padStart(2,'0');
            const tmrwLocal = ilTmrw.getFullYear() + '-' + String(ilTmrw.getMonth()+1).padStart(2,'0') + '-' + String(ilTmrw.getDate()).padStart(2,'0');
            todayEvents.length = 0;
            tomorrowEvents.length = 0;

            // Check if local Outlook is available (with timeout)
            let status = { connected: false };
            try {
                const statusRes = await fetch('/api/outlook-status', { signal: AbortSignal.timeout(5000) });
                status = await statusRes.json();
            } catch(e) {}

            if (status.connected) {
                document.getElementById('authBtn').textContent = 'Outlook Connected';
                document.getElementById('authBtn').style.background = 'var(--accent-green)';
                document.getElementById('authBtn').style.borderColor = 'var(--accent-green)';
            }

            // Fetch calendar (Outlook COM, Graph API, or synced — server handles fallback)
            try {
                const calRes = await fetch('/api/calendar');
                if (calRes.ok) {
                    const calData = await calRes.json();
                    if (Array.isArray(calData) && calData.length > 0) {
                        calData.forEach(evt => {
                            const evtDate = evt.start.split('T')[0];
                            const startTime = evt.start.split('T')[1]?.substring(0, 5) || '00:00';
                            const endTime = evt.end.split('T')[1]?.substring(0, 5) || '00:00';
                            const entry = { time: startTime, end: endTime, title: evt.subject, location: evt.location, isOnline: evt.isOnline, entryId: evt.entryId || null, teamsLink: evt.teamsLink || null };
                            if (evtDate === todayLocal) todayEvents.push(entry);
                            else if (evtDate === tmrwLocal) tomorrowEvents.push(entry);
                        });
                        lastFetchTime = new Date();
                    }
                }
            } catch(e) {}

            // Always try synced data (merges Outlook events from local PC)
            try {
                const syncedCalRes = await fetch('/api/synced/calendar');
                if (syncedCalRes.ok) {
                    const syncedCal = await syncedCalRes.json();
                    if (Array.isArray(syncedCal) && syncedCal.length > 0) {
                        syncedCal.forEach(evt => {
                            const evtDate = evt.start.split('T')[0];
                            const startTime = evt.start.split('T')[1]?.substring(0, 5) || '00:00';
                            const endTime = evt.end.split('T')[1]?.substring(0, 5) || '00:00';
                            // Avoid duplicates (same time + title)
                            const isDup = [...todayEvents, ...tomorrowEvents].some(x => x.time === startTime && x.title === evt.subject);
                            if (isDup) return;
                            const entry = { time: startTime, end: endTime, title: evt.subject, location: evt.location, isOnline: evt.isOnline, teamsLink: evt.teamsLink };
                            if (evtDate === todayLocal) todayEvents.push(entry);
                            else if (evtDate === tmrwLocal) tomorrowEvents.push(entry);
                        });
                        todayEvents.sort((a, b) => a.time.localeCompare(b.time));
                        tomorrowEvents.sort((a, b) => a.time.localeCompare(b.time));
                        lastFetchTime = new Date();
                    }
                }
            } catch(e) {}

            // Fetch emails (Outlook COM, Graph API, or synced)
            try {
                const emailRes = await fetch('/api/emails');
                if (emailRes.ok) {
                    const emailData = await emailRes.json();
                    if (Array.isArray(emailData) && emailData.length > 0) {
                        liveEmails = emailData;
                        state.liveEmails = emailData;
                        lastFetchTime = new Date();
                    }
                }
            } catch(e) {}

            // If no emails, try synced data
            if (liveEmails.length === 0) {
                try {
                    const syncedRes = await fetch('/api/synced/emails');
                    if (syncedRes.ok) {
                        const syncedEmails = await syncedRes.json();
                        if (Array.isArray(syncedEmails) && syncedEmails.length > 0) {
                            liveEmails = syncedEmails;
                            state.liveEmails = syncedEmails;
                        }
                    }
                } catch(e) {}
            }

            // Fetch Teams data (chats, mentions, channels)
            try {
                const [chatsRes, mentionsRes, channelsRes] = await Promise.allSettled([
                    fetch('/api/teams/chats'),
                    fetch('/api/teams/mentions'),
                    fetch('/api/teams/channels')
                ]);

                if (chatsRes.status === 'fulfilled' && chatsRes.value.ok) {
                    const data = await chatsRes.value.json();
                    if (Array.isArray(data)) teamsChats = data;
                    else if (data && Array.isArray(data.chats)) teamsChats = data.chats;
                }
                if (mentionsRes.status === 'fulfilled' && mentionsRes.value.ok) {
                    const data = await mentionsRes.value.json();
                    if (Array.isArray(data)) teamsMentions = data;
                }
                if (channelsRes.status === 'fulfilled' && channelsRes.value.ok) {
                    const data = await channelsRes.value.json();
                    if (Array.isArray(data)) teamsChannels = data;
                }
            } catch(e) {}

            // Fetch synced digest if local digest is empty
            try {
                const digestRes = await fetch('/api/copilot/digest');
                if (digestRes.ok) {
                    const digestData = await digestRes.json();
                    if (digestData && digestData.generated && digestData.raw && digestData.raw.length > 50) {
                        copilotData = digestData;
                    }
                }
                if (!copilotData || !copilotData.raw || copilotData.raw.length < 50) {
                    const syncedDigestRes = await fetch('/api/synced/digest');
                    if (syncedDigestRes.ok) {
                        const syncedDigest = await syncedDigestRes.json();
                        if (syncedDigest && syncedDigest.raw && syncedDigest.raw.length > 50) {
                            copilotData = syncedDigest;
                        }
                    }
                }
                renderCombinedDigest();
            } catch(e) {}

            // Fetch news feed + Israel news + weather
            try {
                const [newsRes, xRes, israelRes, weatherRes] = await Promise.allSettled([
                    fetch('/api/news'),
                    fetch('/api/news/x'),
                    fetch('/api/news/israel'),
                    fetch('/api/weather')
                ]);
                newsItems = [];
                if (newsRes.status === 'fulfilled' && newsRes.value.ok) {
                    const data = await newsRes.value.json();
                    if (Array.isArray(data)) newsItems.push(...data);
                }
                if (xRes.status === 'fulfilled' && xRes.value.ok) {
                    const data = await xRes.value.json();
                    if (Array.isArray(data)) newsItems.push(...data);
                }
                newsItems.sort((a, b) => new Date(b.time) - new Date(a.time));
                renderNewsPanel(); // render news + stocks mini after data arrives
                if (israelRes.status === 'fulfilled' && israelRes.value.ok) {
                    const data = await israelRes.value.json();
                    if (Array.isArray(data)) { israelNews = data; renderIsraelPanel(); }
                }
                if (weatherRes.status === 'fulfilled' && weatherRes.value.ok) {
                    const data = await weatherRes.value.json();
                    if (data && !data.error) { weatherData = data; renderWeatherPanel(); }
                }
            } catch(e) { /* news not available */ }

            // Fetch Google Calendar events
            try {
                const gcalRes = await fetch('/api/google/calendar');
                if (gcalRes.ok) {
                    const gcalData = await gcalRes.json();
                    if (Array.isArray(gcalData) && gcalData.length > 0) {
                        gcalData.forEach(evt => {
                            // Always parse in Israel timezone
                            const evtLocalDate = new Date(evt.start);
                            const ilStart = new Date(evtLocalDate.toLocaleString('en-US', { timeZone: 'Asia/Jerusalem' }));
                            const evtDate = ilStart.getFullYear() + '-' + String(ilStart.getMonth()+1).padStart(2,'0') + '-' + String(ilStart.getDate()).padStart(2,'0');
                            const startTime = String(ilStart.getHours()).padStart(2,'0') + ':' + String(ilStart.getMinutes()).padStart(2,'0');
                            const evtEndDate = new Date(evt.end);
                            const ilEnd = new Date(evtEndDate.toLocaleString('en-US', { timeZone: 'Asia/Jerusalem' }));
                            const endTime = String(ilEnd.getHours()).padStart(2,'0') + ':' + String(ilEnd.getMinutes()).padStart(2,'0');
                            const entry = {
                                time: startTime,
                                end: endTime,
                                title: evt.subject,
                                location: evt.location,
                                isOnline: evt.isOnline,
                                teamsLink: evt.teamsLink,
                                source: 'gmail'
                            };

                            if (evtDate === todayLocal) todayEvents.push(entry);
                            else if (evtDate === tmrwLocal) tomorrowEvents.push(entry);
                        });

                        // Re-sort by time
                        todayEvents.sort((a, b) => a.time.localeCompare(b.time));
                        tomorrowEvents.sort((a, b) => a.time.localeCompare(b.time));

                        // Also populate gcalEvents for the dedicated panel
                        gcalEvents = gcalData;
                    }
                }
            } catch(e) { /* google calendar not available */ }

            // Fetch Mondial games
            try {
                const mondialRes = await fetch('/api/mondial');
                if (mondialRes.ok) {
                    const allGames = await mondialRes.json();
                    const todayDate = today.toISOString().split('T')[0];
                    const tmrwDate = tomorrow.toISOString().split('T')[0];
                    mondialGames = { today: [], tomorrow: [], results: [] };
                    const threeDaysAgo = new Date(Date.now() - 3*24*60*60*1000).toISOString().split('T')[0];
                    for (const g of allGames) {
                        if (!g.date) continue;
                        const gd = g.date.split('T')[0];
                        if (gd === todayDate) mondialGames.today.push(g);
                        else if (gd === tmrwDate) mondialGames.tomorrow.push(g);
                        if (g.status === 'FINISHED' && gd >= threeDaysAgo) mondialGames.results.push(g);
                    }
                }
            } catch {}

            // Windchill tasks loaded via iframe (SSO session in browser)

            // Sync projects TO server (push local state)
            try {
                await fetch('/api/projects', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(state.projects)
                });
            } catch(e) {}

            // Load projects FROM server (authoritative — works on GitHub Pages and Render)
            try {
                const projRes = await fetch('/api/projects');
                if (projRes.ok) {
                    const serverProjects = await projRes.json();
                    if (Array.isArray(serverProjects) && serverProjects.length > 0 &&
                        (state.projects.length === 0 || serverProjects.length > state.projects.length)) {
                        state.projects = serverProjects;
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
                    }
                }
            } catch(e) {}

            // Always ensure Outlook data shows — force display even if fetch returned empty
            if (liveEmails.length === 0) {
                try {
                    const fallbackRes = await fetch('/api/synced/emails');
                    if (fallbackRes.ok) {
                        const fallbackEmails = await fallbackRes.json();
                        if (Array.isArray(fallbackEmails) && fallbackEmails.length > 0) {
                            liveEmails = fallbackEmails;
                            state.liveEmails = fallbackEmails;
                        }
                    }
                } catch(e) {}
            }

            if (todayEvents.length === 0 && tomorrowEvents.length === 0) {
                try {
                    const fallbackCalRes = await fetch('/api/synced/calendar');
                    if (fallbackCalRes.ok) {
                        const fallbackCal = await fallbackCalRes.json();
                        if (Array.isArray(fallbackCal) && fallbackCal.length > 0) {
                            fallbackCal.forEach(evt => {
                                const evtDate = evt.start.split('T')[0];
                                const startTime = evt.start.split('T')[1]?.substring(0, 5) || '00:00';
                                const endTime = evt.end.split('T')[1]?.substring(0, 5) || '00:00';
                                const entry = { time: startTime, end: endTime, title: evt.subject, location: evt.location, isOnline: evt.isOnline, teamsLink: evt.teamsLink, source: 'synced' };
                                if (evtDate === todayLocal) todayEvents.push(entry);
                                else if (evtDate === tmrwLocal) tomorrowEvents.push(entry);
                            });
                            todayEvents.sort((a, b) => a.time.localeCompare(b.time));
                            tomorrowEvents.sort((a, b) => a.time.localeCompare(b.time));
                            lastFetchTime = new Date();
                        }
                    }
                } catch(e) {}
            }

        } catch (e) {
            console.log('Refresh error:', e.message);
        }

        // Also refresh stocks data
        try { await fetchStocks(); } catch(e) {}

        indicator.classList.remove('visible');
        renderAll();
        updateLastFetchDisplay();
    }

    function updateLastFetchDisplay() {
        const el = document.getElementById('lastFetch');
        if (el && lastFetchTime) {
            el.textContent = 'Last sync: ' + lastFetchTime.toLocaleTimeString('en-IL', { hour: '2-digit', minute: '2-digit' });
        } else if (el) {
            el.textContent = 'Not synced yet';
        }
    }

    function exportWeeklyReview() {
        const weekNum = Math.ceil((today - new Date(today.getFullYear(), 0, 1)) / (7 * 24 * 60 * 60 * 1000));
        let body = `Weekly Portfolio Review - Week ${weekNum}\n${'='.repeat(40)}\n\n`;

        state.projects.filter(p => p.priority !== 'done').forEach(p => {
            const statusMap = { 'on-track': 'ON TRACK', 'risk': 'AT RISK', 'blocked': 'BLOCKED' };
            const doneTasks = p.tasks.filter(t => t.done).length;
            body += `${p.name} [${p.priority.toUpperCase()}] - ${statusMap[p.status] || 'ON TRACK'}\n`;
            body += `  Progress: ${doneTasks}/${p.tasks.length} tasks\n`;
            if (p.topRisk) body += `  Risk: ${p.topRisk}\n`;
            if (p.decision) body += `  Decision: ${p.decision}\n`;
            (p.nextActions || []).forEach(a => {
                body += `  > ${a.text} (${a.owner} / ${a.date})\n`;
            });
            body += '\n';
        });

        const stop = document.getElementById('wr-stop')?.value;
        const delay = document.getElementById('wr-delay')?.value;
        const start = document.getElementById('wr-start')?.value;
        if (stop || delay || start) {
            body += `Kill/Push/Start:\n`;
            if (stop) body += `  STOP: ${stop}\n`;
            if (delay) body += `  DELAY: ${delay}\n`;
            if (start) body += `  START: ${start}\n`;
        }

        const subject = encodeURIComponent(`Weekly Portfolio Review - Week ${weekNum}`);
        window.open(`mailto:?subject=${subject}&body=${encodeURIComponent(body)}`, '_self');
    }

    // ============ MARK PROJECT COMPLETE ============
    function markProjectComplete(projectId) {
        const project = state.projects.find(p => p.id === projectId);
        if (!project) return;
        project.tasks.forEach(t => t.done = true);
        project.previousPriority = project.priority;
        project.priority = 'done';
        project.completedAt = new Date().toISOString();
        saveState();
        closeModal();
        renderAll();
    }

    function reopenProject(projectId) {
        const project = state.projects.find(p => p.id === projectId);
        if (!project) return;
        project.priority = project.previousPriority || 'medium';
        delete project.previousPriority;
        delete project.completedAt;
        saveState();
        renderAll();
    }

    // ============ EXPORT TO EMAIL ============
    function exportProjectEmail(projectId) {
        const project = state.projects.find(p => p.id === projectId);
        if (!project) return;

        const doneTasks = project.tasks.filter(t => t.done);
        const openTasks = project.tasks.filter(t => !t.done);
        const progress = project.tasks.length > 0 ? Math.round((doneTasks.length / project.tasks.length) * 100) : 0;

        const subject = encodeURIComponent(`Project Update: ${project.name} - ${progress}% complete`);
        const body = encodeURIComponent(
            `Project: ${project.name}\n` +
            `Deadline: ${project.deadline}\n` +
            `Progress: ${progress}% (${doneTasks.length}/${project.tasks.length} tasks done)\n\n` +
            `--- Completed Tasks ---\n` +
            (doneTasks.length > 0 ? doneTasks.map(t => `  ✓ ${t.text}`).join('\n') : '  (none)\n') +
            `\n\n--- Open Tasks ---\n` +
            (openTasks.length > 0 ? openTasks.map(t => `  ○ ${t.text} (due: ${t.deadline || 'N/A'})`).join('\n') : '  (none - all done!)\n') +
            `\n\n---\nGenerated from Roee's Insight Dashboard`
        );

        window.open(`mailto:?subject=${subject}&body=${body}`, '_self');
    }
