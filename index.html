            <td align="center" style="padding:8px"><div style="font-size:20px;font-weight:700;color:#1a1a1a">${teamsChats.length}</div><div style="font-size:10px;color:#555">Teams Chats</div></td>
        </tr></table>
    </td></tr>

    <!-- Projects -->
    <tr><td style="padding:16px 24px 8px"><h3 style="color:#1a1a1a;font-size:14px;margin:0;border-bottom:2px solid #f0f0f0;padding-bottom:8px">📋 Projects Status</h3></td></tr>
    ${projectsHtml}

    <!-- Calendar -->
    ${calendarHtml}

    <!-- Teams -->
    ${teamsChats.length > 0 ? `
    <tr><td style="padding:16px 24px 8px"><h3 style="color:#1a1a1a;font-size:14px;margin:0;border-bottom:2px solid #f0f0f0;padding-bottom:8px">💬 Teams Activity</h3></td></tr>
    <tr><td style="padding:8px 24px">
        ${teamsChats.slice(0, 5).map(c => `<div style="padding:4px 0;font-size:12px;border-bottom:1px solid #f8fafc"><strong style="color:#1a1a1a">${c.topic || 'Chat'}:</strong> ${c.lastMessage || ''}</div>`).join('')}
    </td></tr>` : ''}

    <!-- Questions -->
    ${questionsHtml}

    <!-- Footer -->
    <tr><td style="padding:16px 24px;background:#f8fafc;text-align:center;border-top:1px solid #f0f0f0">
        <p style="font-size:10px;color:#999;margin:0">Generated from Roee's Insight Dashboard | ${new Date().toLocaleString('en-IL')}</p>
    </td></tr>
</table>
</body>
</html>`;

        // Show preview modal with send option
        const previewModal = `
            <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
                <div class="modal" style="max-width:700px;max-height:85vh;display:flex;flex-direction:column">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-shrink:0">
                        <h2 style="margin:0">Email Summary Preview</h2>
                        <span onclick="closeModal()" style="cursor:pointer;font-size:1.5rem;color:var(--text-secondary)">&times;</span>
                    </div>
                    <div class="form-group" style="flex-shrink:0">
                        <label>To</label>
                        <input type="email" id="emailTo" placeholder="recipient@philips.com" style="width:100%">
                    </div>
                    <div class="form-group" style="flex-shrink:0">
                        <label>Add a question or note (will appear in the email)</label>
                        <textarea id="emailQuestion" rows="2" placeholder="e.g. Can we push the Clean Room deadline? Need your input on the procurement specs..." style="width:100%"></textarea>
                    </div>
                    <div style="flex:1;overflow-y:auto;border:1px solid #f0f0f0;border-radius:8px;margin-bottom:12px;min-height:200px">
                        <iframe id="emailPreviewFrame" style="width:100%;height:100%;border:none;min-height:400px"></iframe>
                    </div>
                    <div class="modal-actions" style="flex-shrink:0">
                        <button class="btn btn-ghost" onclick="closeModal()" style="color:var(--text-primary)">Cancel</button>
                        <button class="btn btn-ghost" onclick="copyEmailHtml()" style="color:var(--text-primary)">Copy HTML</button>
                        <button class="btn btn-primary" onclick="sendEmailSummary()">&#9993; Send via Outlook</button>
                    </div>
                </div>
            </div>
        `;
        document.getElementById('modalContainer').innerHTML = previewModal;

        // Write HTML to iframe
        setTimeout(() => {
            const frame = document.getElementById('emailPreviewFrame');
            frame.contentDocument.open();
            frame.contentDocument.write(htmlBody);
            frame.contentDocument.close();
        }, 100);

        // Store for send
        window._emailHtmlBody = htmlBody;
        window._emailSubject = `Dashboard Summary — ${dateStr}`;
    }

    function sendEmailSummary() {
        const to = document.getElementById('emailTo').value.trim();
        const question = document.getElementById('emailQuestion').value.trim();

        let finalHtml = window._emailHtmlBody;
        if (question) {
            const questionBlock = `<tr><td style="padding:16px;background:#FEF2F2;border-radius:8px;margin:8px 24px"><h3 style="color:#CC0000;font-size:14px;margin-bottom:6px">❓ Question from Roee</h3><p style="font-size:13px;color:#333;margin:0">${question.replace(/</g,'&lt;').replace(/\n/g,'<br>')}</p></td></tr>`;
            finalHtml = finalHtml.replace('<!-- Questions -->', questionBlock + '\n    <!-- Questions -->');
        }

        const subject = encodeURIComponent(window._emailSubject);
        const body = encodeURIComponent(finalHtml.replace(/\n/g, ''));

        // Use mailto with HTML body (Outlook handles this)
        const mailto = `mailto:${to}?subject=${subject}&body=${encodeURIComponent(question ? `[See styled version in Outlook]\n\n${question}\n\n---\nFull dashboard summary attached in this email.` : '[Dashboard summary - view in Outlook for styled version]')}`;
        window.open(mailto, '_self');
        closeModal();
    }

    function copyEmailHtml() {
        const question = document.getElementById('emailQuestion').value.trim();
        let finalHtml = window._emailHtmlBody;
        if (question) {
            const questionBlock = `<tr><td style="padding:16px;background:#FEF2F2;border-radius:8px;margin:8px 24px"><h3 style="color:#CC0000;font-size:14px;margin-bottom:6px">❓ Question from Roee</h3><p style="font-size:13px;color:#333;margin:0">${question.replace(/</g,'&lt;').replace(/\n/g,'<br>')}</p></td></tr>`;
            finalHtml = finalHtml.replace('<!-- Questions -->', questionBlock + '\n    <!-- Questions -->');
        }
        navigator.clipboard.writeText(finalHtml).then(() => {
            alert('HTML copied to clipboard! Paste in Outlook using Ctrl+Shift+V or insert as HTML.');
        });
    }

    // ============ MOBILE UX ============
    const MOBILE_TABS = ['calendar', 'projects', 'digest', 'inbox', 'feed', 'stocks'];
    let currentMobileTab = 'calendar';
    let currentTabIndex = 0;

    function isMobile() {
        return window.innerWidth <= 480;
    }

    function switchMobileTab(tab, direction) {
        const prevTab = currentMobileTab;
        currentMobileTab = tab;
        currentTabIndex = MOBILE_TABS.indexOf(tab);

        const tabs = document.querySelectorAll('.mobile-tab');
        tabs.forEach((t, i) => {
            t.classList.toggle('active', MOBILE_TABS[i] === tab);
        });

        const panels = document.querySelectorAll('.mobile-panel');
        panels.forEach(p => {
            const panelName = p.getAttribute('data-panel');
            const isActive = (tab === 'feed') ? panelName === 'digest' : panelName === tab;
            if (isActive) {
                p.classList.add('active');
                // Slide animation based on swipe direction
                if (direction && prevTab !== tab) {
                    p.style.animation = 'none';
                    p.offsetHeight; // force reflow
                    p.style.animation = direction === 'left' ? 'mobileSlideLeft 0.25s ease' : 'mobileSlideRight 0.25s ease';
                }
            } else {
                p.classList.remove('active');
            }
        });

        // Show/hide sub-panels for feed vs digest
        const copilot = document.getElementById('copilotPanel');
        const newsPanel = document.getElementById('newsPanel');
        if (tab === 'feed') {
            if (copilot) copilot.parentElement.style.display = 'none';
            if (newsPanel) { newsPanel.parentElement.style.display = ''; newsPanel.parentElement.style.flex = '1'; }
        } else if (tab === 'digest') {
            if (copilot) copilot.parentElement.style.display = '';
            if (newsPanel) newsPanel.parentElement.style.display = 'none';
        } else {
            if (copilot) copilot.parentElement.style.display = '';
            if (newsPanel) newsPanel.parentElement.style.display = '';
        }

        // Scroll active tab into view
        const activeTabEl = document.querySelector('.mobile-tab.active');
        if (activeTabEl) activeTabEl.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });

        if (navigator.vibrate) navigator.vibrate(8);
    }

    // ===== SWIPE GESTURE HANDLER =====
    let swipeStartX = 0;
    let swipeStartY = 0;
    let swiping = false;

    function initSwipeGestures() {
        const layout = document.querySelector('.main-layout');
        if (!layout) return;

        layout.addEventListener('touchstart', (e) => {
            swipeStartX = e.touches[0].clientX;
            swipeStartY = e.touches[0].clientY;
            swiping = true;
        }, { passive: true });

        layout.addEventListener('touchmove', (e) => {
            if (!swiping) return;
            const diffX = e.touches[0].clientX - swipeStartX;
            const diffY = e.touches[0].clientY - swipeStartY;
            // Only horizontal swipes (not vertical scrolling)
            if (Math.abs(diffX) > 50 && Math.abs(diffX) > Math.abs(diffY) * 1.5) {
                swiping = false;
                if (diffX < 0 && currentTabIndex < MOBILE_TABS.length - 1) {
                    switchMobileTab(MOBILE_TABS[currentTabIndex + 1], 'left');
                } else if (diffX > 0 && currentTabIndex > 0) {
                    switchMobileTab(MOBILE_TABS[currentTabIndex - 1], 'right');
                }
            }
        }, { passive: true });

        layout.addEventListener('touchend', () => { swiping = false; }, { passive: true });
    }

    // ===== PULL-TO-REFRESH =====
    let pullStartY = 0;
    let pulling = false;
    let pullIndicator = null;

    function initPullToRefresh() {
        pullIndicator = document.createElement('div');
        pullIndicator.className = 'pull-indicator';
        pullIndicator.style.cssText = 'text-align:center;padding:0;height:0;overflow:hidden;transition:height 0.2s,opacity 0.2s;opacity:0;font-size:0.8rem;color:var(--text-secondary)';
        pullIndicator.innerHTML = '&#8635; Pull to refresh';
        const layout = document.querySelector('.main-layout');
        if (layout) layout.parentElement.insertBefore(pullIndicator, layout);

        document.addEventListener('touchstart', (e) => {
            if (window.scrollY <= 5) {
                pullStartY = e.touches[0].clientY;
                pulling = true;
            }
        }, { passive: true });

        document.addEventListener('touchmove', (e) => {
            if (!pulling) return;
            const diff = e.touches[0].clientY - pullStartY;
            if (diff > 0 && diff < 120) {
                pullIndicator.style.height = Math.min(diff * 0.5, 40) + 'px';
                pullIndicator.style.opacity = Math.min(diff / 80, 1);
                if (diff > 70) pullIndicator.innerHTML = '&#8635; Release to refresh';
            }
            if (diff > 80) {
                pulling = false;
                pullIndicator.innerHTML = '&#9881; Refreshing...';
                pullIndicator.style.height = '36px';
                if (navigator.vibrate) navigator.vibrate(15);
                refreshData().finally(() => {
                    setTimeout(() => {
                        pullIndicator.style.height = '0';
                        pullIndicator.style.opacity = '0';
                        pullIndicator.innerHTML = '&#8635; Pull to refresh';
                    }, 600);
                });
            }
        }, { passive: true });

        document.addEventListener('touchend', () => {
            pulling = false;
            pullIndicator.style.height = '0';
            pullIndicator.style.opacity = '0';
            pullIndicator.innerHTML = '&#8635; Pull to refresh';
        }, { passive: true });
    }

    // ===== MOBILE LAYOUT CONTROLLER =====
    function checkMobileLayout() {
        const tabs = document.getElementById('mobileTabs');
        if (isMobile()) {
            tabs.style.display = 'flex';
            switchMobileTab(currentMobileTab);
            initSwipeGestures();
            initPullToRefresh();
        } else {
            tabs.style.display = 'none';
            document.querySelectorAll('.mobile-panel').forEach(p => p.classList.remove('active'));
        }
    }

    window.addEventListener('resize', checkMobileLayout);
    checkMobileLayout();

    // Make insights tappable on mobile (expand preview)
    document.addEventListener('click', (e) => {
        if (!isMobile()) return;
        const item = e.target.closest('.insight-item');
        if (item) {
            item.classList.toggle('expanded');
        }
    });

    // ============ MOBILE FAB & ACTIONS ============
    function openMobileActions() {
        const html = `
            <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
                <div class="modal" style="padding:20px">
                    <h2 style="text-align:center;margin-bottom:16px">Quick Actions</h2>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
                        <button onclick="closeModal();openAddProject()" style="padding:16px;border:1.5px solid #f0f0f0;border-radius:14px;background:white;font-size:0.85rem;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;-webkit-tap-highlight-color:transparent"><span style="font-size:1.5rem">&#128203;</span>New Project</button>
                        <button onclick="closeModal();refreshData()" style="padding:16px;border:1.5px solid #f0f0f0;border-radius:14px;background:white;font-size:0.85rem;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;-webkit-tap-highlight-color:transparent"><span style="font-size:1.5rem">&#128260;</span>Refresh All</button>
                        <button onclick="closeModal();refreshCopilotDigest()" style="padding:16px;border:1.5px solid #f0f0f0;border-radius:14px;background:white;font-size:0.85rem;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;-webkit-tap-highlight-color:transparent"><span style="font-size:1.5rem">&#9733;</span>Refresh Digest</button>
                        <button onclick="closeModal();handleAuth()" style="padding:16px;border:1.5px solid #f0f0f0;border-radius:14px;background:white;font-size:0.85rem;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;-webkit-tap-highlight-color:transparent"><span style="font-size:1.5rem">&#128272;</span>Connect M365</button>
                        <button onclick="closeModal();connectGmail()" style="padding:16px;border:1.5px solid #f0f0f0;border-radius:14px;background:white;font-size:0.85rem;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;-webkit-tap-highlight-color:transparent"><span style="font-size:1.5rem">&#128231;</span>Connect Gmail</button>
                        <button onclick="closeModal();exportDashboardEmail()" style="padding:16px;border:1.5px solid #f0f0f0;border-radius:14px;background:white;font-size:0.85rem;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;-webkit-tap-highlight-color:transparent"><span style="font-size:1.5rem">&#9993;</span>Email Summary</button>
                        <button onclick="closeModal();openTimelineFullscreen()" style="padding:16px;border:1.5px solid #f0f0f0;border-radius:14px;background:white;font-size:0.85rem;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;-webkit-tap-highlight-color:transparent"><span style="font-size:1.5rem">&#9881;</span>Manage Projects</button>
                        <button onclick="closeModal();switchMobileTab('calendar')" style="padding:16px;border:1.5px solid #f0f0f0;border-radius:14px;background:white;font-size:0.85rem;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;-webkit-tap-highlight-color:transparent"><span style="font-size:1.5rem">&#128197;</span>Calendar</button>
                    </div>
                    <button onclick="closeModal()" style="width:100%;margin-top:14px;padding:14px;background:#f5f5f5;border:none;border-radius:12px;font-size:0.9rem;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent">Cancel</button>
                </div>
            </div>`;
        document.getElementById('modalContainer').innerHTML = html;
    }

    // Show FAB on mobile
    function updateMobileFab() {
        const fab = document.getElementById('mobileFab');
        if (fab) fab.style.display = isMobile() ? 'block' : 'none';
    }
    updateMobileFab();
    window.addEventListener('resize', updateMobileFab);

    // ============ SYNC OUTLOOK (Manual Pull from Graph API) ============
    async function syncOutlookData() {
        const btn = document.getElementById('syncOutlookBtn');
        const originalText = btn.innerHTML;
        btn.innerHTML = '&#8987; Syncing...';
        btn.disabled = true;
        btn.style.opacity = '0.7';
        try {
            const authRes = await fetch('/auth/status');
            const authStatus = await authRes.json();
            if (!authStatus.authenticated) {
                btn.innerHTML = originalText; btn.disabled = false; btn.style.opacity = '1';
                handleAuth(); return;
            }
            const res = await fetch('/api/sync/pull', { method: 'POST', headers: { 'Content-Type': 'application/json' } });
            const data = await res.json();
            if (data.ok) {
                btn.innerHTML = '&#9989; Synced!'; btn.style.background = 'var(--accent-green)';
                if (data.counts) {
                    document.getElementById('lastFetch').textContent = 'Synced: ' + data.counts.emails + ' emails, ' + data.counts.calendar + ' events at ' + new Date().toLocaleTimeString('en-IL', { hour: '2-digit', minute: '2-digit' });
                }
                await refreshData();
                setTimeout(() => { btn.innerHTML = originalText; btn.style.background = 'rgba(255,255,255,0.15)'; btn.disabled = false; btn.style.opacity = '1'; }, 3000);
            } else {
                btn.innerHTML = '&#10060; ' + (data.error || 'Failed'); btn.style.background = '#dc2626';
                setTimeout(() => { btn.innerHTML = originalText; btn.style.background = 'rgba(255,255,255,0.15)'; btn.disabled = false; btn.style.opacity = '1'; }, 3000);
            }
        } catch (e) {
            btn.innerHTML = '&#10060; Error'; btn.style.background = '#dc2626';
            setTimeout(() => { btn.innerHTML = originalText; btn.style.background = 'rgba(255,255,255,0.15)'; btn.disabled = false; btn.style.opacity = '1'; }, 3000);
        }
    }

    // ============ INIT ============
    refreshData();
    </script>
</body>
</html>
